<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" role="img" aria-label="逻辑推导示意：前提汇聚到结论">
  <rect width="220" height="180" rx="16" fill="#f4f7fb"/>
  <g font-family="'Noto Sans SC',sans-serif" font-size="12" fill="#1e5a8e">
    <rect x="16" y="20" width="72" height="30" rx="8" fill="#fff" stroke="#1e5a8e" stroke-width="1.5"/>
    <text x="52" y="40" text-anchor="middle">前提 P</text>
    <rect x="132" y="20" width="72" height="30" rx="8" fill="#fff" stroke="#1e5a8e" stroke-width="1.5"/>
    <text x="168" y="40" text-anchor="middle">前提 Q</text>
    <rect x="74" y="132" width="72" height="32" rx="8" fill="#2f7a54"/>
    <text x="110" y="153" text-anchor="middle" fill="#fff">结论 C</text>
    <path d="M52 50 C52 96 90 100 103 132" stroke="#3f9d6d" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M168 50 C168 96 130 100 117 132" stroke="#3f9d6d" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="110" y="100" text-anchor="middle" fill="#b7791f">∴</text>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3f9d6d"/>
    </marker>
  </defs>
</svg>
